# Authelia: login portal + OIDC provider for Open WebUI.
# Templated (X_AUTHELIA_CONFIG_FILTERS=template): the env and secret template functions below are resolved
# at startup. The template engine also runs on comments, so never write template braces in a comment.
# Other secrets come from *_FILE env vars in docker-compose.yml.
theme: auto

server:
  address: 'tcp://:9091'

log:
  level: info

totp:
  issuer: 'cpre-tutor'

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2

access_control:
  default_policy: deny # anything not matched below is denied
  rules:
    - domain: '*.{{ env "DOMAIN" }}' # only our own hosts, always with 2FA
      policy: two_factor

session:
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "DOMAIN" }}'
      default_redirection_url: 'https://tutor.{{ env "DOMAIN" }}'

regulation: # brute-force protection
  max_retries: 5
  find_time: 10m
  ban_time: 30m

storage:
  local:
    path: /config/db.sqlite3

notifier:
  # No SMTP: one-time codes (e.g. TOTP registration) are written to /config/notification.txt on the VM.
  filesystem:
    filename: /config/notification.txt

identity_providers:
  oidc:
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/secrets/oidc_jwks.pem" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'open-webui'
        client_name: 'Open WebUI'
        client_secret: '{{ secret "/secrets/oidc_client_secret.hash" }}'
        public: false
        authorization_policy: 'two_factor'
        require_pkce: false
        redirect_uris:
          - 'https://tutor.{{ env "DOMAIN" }}/oauth/oidc/callback'
        scopes: ['openid', 'email', 'profile', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
